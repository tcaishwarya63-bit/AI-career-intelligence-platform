[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercast-ai"
version = "1.0.0"
description = "AI-Powered Career Intelligence, Path Prediction & Resume Analytics Platform"
readme = "README.md"
authors = [
    { name = "Aishwarya T C", email = "tcaishwarya63@gmail.com" }
]
license = { text = "MIT" }
keywords = ["career-prediction", "nlp", "spacy", "machine-learning", "smart-india-hackathon", "sih2025"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "spacy>=3.7.0",
    "pypdf>=4.0.0",
    "joblib>=1.3.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
careercast = "ml.server:main"

[project.urls]
Homepage = "https://github.com/tcaishwarya63-bit/AI-career-intelligence-platform"
Repository = "https://github.com/tcaishwarya63-bit/AI-career-intelligence-platform.git"
